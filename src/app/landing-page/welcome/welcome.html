<section class="welcome" id="hero">
  <div class="welcome__inner-box">
    <h1 class="welcome__caption">
      <span class="welcome__caption-line">{{ 'HERO.TITLE_FRONTEND' | translate }}</span>
      <span class="welcome__caption-line">{{ 'HERO.TITLE_DEVELOPER' | translate }}</span>
    </h1>

    <div class="welcome__down">
      <span class="welcome__divider" aria-hidden="true"></span>
      <span class="welcome__author">Saeed Ghorbani</span>
    </div>
  </div>

  <a class="welcome__email" [href]="'mailto:' + userDBS.ownerProfile.mail">
    {{ userDBS.ownerProfile.mail }}
  </a>

  <div class="welcome__scroll" aria-hidden="true">
    <div class="welcome__arrow-wrapper">
      <img
        class="welcome__arrow-icon"
        src="assets/img/icons/02-welcome/arrow-to-down.svg"
        [attr.alt]="'HERO.ARROW_ALT' | translate"
      />
    </div>
    <span class="welcome__scroll-text">{{ 'HERO.SCROLL_TEXT' | translate }}</span>
  </div>
</section>
