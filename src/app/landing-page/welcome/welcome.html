<section class="welcome" id="hero">
  <div class="welcome__content">
    <h1 class="welcome__title">
      <span class="welcome__title-line">Frontend</span>
      <span class="welcome__title-line">Entwickler</span>
    </h1>

    <div class="welcome__down">
      <span class="welcome__line" aria-hidden="true"></span>
      <span class="welcome__name">Saeed Ghorbani</span>
    </div>
  </div>

  <a class="welcome__scroll" href="#about" style="text-decoration: none; color: inherit">
    <div class="welcome__arrow-wrapper">
      <img
        class="welcome__arrow-icon"
        src="assets/img/icons/02-welcome/arrow-to-down.svg"
        [attr.alt]="'HERO.ARROW_ALT' | translate"
      />
    </div>
    <span class="welcome__scroll-text">{{ 'HERO.SCROLL_TEXT' | translate }}</span>
  </a>
</section>
