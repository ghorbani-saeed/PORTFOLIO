<section class="welcome" id="hero">
  <div class="welcome__inner-box">
    <h1 class="welcome__caption">
      <span class="welcome__caption-line">Frontend</span>
      <span class="welcome__caption-line">Entwickler</span>
    </h1>

    <div class="welcome__down">
      <span class="welcome__divider" aria-hidden="true"></span>
      <span class="welcome__author">Saeed Ghorbani</span>
    </div>
  </div>

  <a class="welcome__scroll-btn" href="#about" style="text-decoration: none; color: inherit">
    <div class="welcome__arrow-box">
      <img
        class="welcome__arrow arrow-icon"
        src="assets/img/icons/02-welcome/arrow-to-down.svg"
        [attr.alt]="'HERO.ARROW_ALT' | translate"
      />
    </div>
    <span class="welcome__scroll-btn-hint">{{ 'HERO.SCROLL_TEXT' | translate }}</span>
  </a>
</section>
