<section class="introduction" id="about" [attr.aria-label]="'ABOUT.ARIA_LABEL' | translate">
  <div class="introduction__inner">
    <div class="introduction__main-content">
      <h2 class="introduction__heading" id="about-me-title">{{ 'ABOUT.TITLE' | translate }}</h2>

      <div class="introduction__paragraphbox">
        <p class="introduction__summary">
          {{ 'ABOUT.DESCRIPTION_LINE_1' | translate }}<br />
          {{ 'ABOUT.DESCRIPTION_LINE_2' | translate }}<br />
          {{ 'ABOUT.DESCRIPTION_LINE_3' | translate }}
        </p>

        <ul class="introduction__feature-list">
          <li class="introduction__feature-item">
            <span class="introduction__badge" aria-hidden="true">
              <img
                src="/assets/img/icons/05-about-me/house.svg"
                [attr.alt]="'ABOUT.HOUSE_ICON_ALT' | translate"
              />
            </span>
            <span>{{ 'ABOUT.HIGHLIGHT_LOCATION' | translate }}</span>
          </li>
          <li class="introduction__feature-item">
            <span class="introduction__badge" aria-hidden="true">
              <img
                src="/assets/img/icons/05-about-me/laptop.svg"
                [attr.alt]="'ABOUT.LAPTOP_ICON_ALT' | translate"
              />
            </span>
            <span>{{ 'ABOUT.HIGHLIGHT_REMOTE' | translate }}</span>
          </li>
        </ul>
      </div>

      <a class="introduction__action-link" href="#contact">{{ 'ABOUT.CTA' | translate }}</a>
    </div>

    <div class="introduction__media-aside">
      <div class="introduction__avatar-holder">
        <img
          class="introduction__portrait"
          src="/assets/img/headshots/headshot.jpg"
          [attr.alt]="'ABOUT.PORTRAIT_ALT' | translate"
        />
      </div>
    </div>
  </div>

  <a
    class="introduction__block-divider"
    href="#skills"
    [attr.aria-label]="'ABOUT.SEPARATOR_ARIA' | translate"
  >
    <app-divider-to-left></app-divider-to-left>
  </a>
</section>
