<section class="hero" id="hero" [attr.aria-label]="'HERO.ARIA_LABEL' | translate">
  <div class="hero__content">
    <div class="hero__title-group">
      <h1 class="hero__title">
        <span class="hero__title-line">{{ 'HERO.TITLE_FRONTEND' | translate }}</span>
        <span class="hero__title-line">{{ 'HERO.TITLE_DEVELOPER' | translate }}</span>
      </h1>
      <div class="hero__down">
        <span class="hero__line" aria-hidden="true"></span>
        <span class="hero__name">{{ displayName }}</span>
      </div>
    </div>
  </div>

  <a class="hero__email" [href]="'mailto:' + userDBS.profileData.mail">
    {{ userDBS.profileData.mail }}
  </a>

  <div class="hero__scroll" aria-hidden="true">
    <div class="hero__arrow-wrapper">
      <img
        class="hero__arrow-icon"
        src="/assets/img/icons/arrow.svg"
        [attr.alt]="'HERO.ARROW_ALT' | translate"
      />
    </div>
    <span class="hero__scroll-text">{{ 'HERO.SCROLL_TEXT' | translate }}</span>
  </div>
</section>
